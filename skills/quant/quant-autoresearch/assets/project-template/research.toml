[project]
name = "__NAME__"
metric = "__METRIC__"
data_file = "data/prices.csv"
data_version = "__DATA_VERSION__"

[mode]
name = "__MODE__"

[mode.refiner]
eps = 0.005
complexity_lines = 15

[experiment]
budget_seconds = __BUDGET__
timeout_seconds = __TIMEOUT__
backtest_cmd = "__ENGINE_CMD__"
metrics_file = "metrics.json"
allowed_files = ["strategy.py"]

[decision]
direction = "__DIRECTION__"
min_improvement = 0.05
min_improvement_abs = 0.0
# Set > 0 to require a significance gate. 2.0 suits monthly-rebalanced factor research;
# keep 0 for the default metric+constraints rule (see references/protocol.md).
min_t_stat = 0.0

[decision.constraints.max_drawdown]
limit = 0.35
kind = "max"

[decision.constraints.turnover]
limit = 4.0
kind = "max"

[decision.constraints.exposure]
limit = 1.0
kind = "max"

[validation]
test_fraction = 0.3

[cost]
bps = 5

[benchmark]
name = "buy_hold"
code = ""

[report]
language = "zh"

[autonomy]
max_iterations = 0
checkpoint_every = 0
